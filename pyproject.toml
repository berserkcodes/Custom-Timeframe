[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chronochart"
version = "0.1.0"
description = "Custom-timeframe financial candle processing"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "yfinance>=0.2.54,<1",
]

[tool.setuptools.packages.find]
include = ["chronochart*"]
