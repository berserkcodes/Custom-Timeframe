[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chronochart"
version = "0.1.0"
description = "Custom-timeframe financial candle processing"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.2,<3",
    "pandas>=2.2,<4",
    "yfinance>=0.2.54,<1",
]

[project.scripts]
chronochart = "chronochart.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["chronochart*"]
